aid: rill-data
name: Rill Data
description: >-
  Rill Data builds Rill, an operational business-intelligence tool for fast,
  exploratory dashboards on large event and time-series data. Developers connect
  data sources, model last-mile transformations in SQL/YAML, define a governed
  metrics layer, and publish interactive dashboards — locally with the free Rill
  Developer app or hosted on Rill Cloud. Rill is open source (Go/TypeScript) and
  exposes a Protobuf-defined admin API over gRPC/Connect and JSON/HTTP at
  api.rilldata.com, a first-party CLI, embeddable dashboards, custom data APIs,
  and an official hosted Model Context Protocol (MCP) server that lets LLMs query
  its governed metrics views. Rill Data is a portfolio company of Bloomberg Beta,
  DCVC, and Sierra Ventures.
