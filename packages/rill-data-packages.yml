notes: >-
  Rill is distributed primarily as a single Go binary (the `rill` CLI, which is
  both the local Rill Developer app and the Cloud admin client) rather than as a
  set of per-language client SDKs. The API contract is Protobuf-defined and
  exposed over gRPC/Connect + JSON/HTTP; there is no dedicated first-party
  REST client SDK library. The MCP integration reuses the community `mcp-remote`
  npm shim (third-party) plus OAuth.
